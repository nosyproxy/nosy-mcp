[package]
name = "nosy-mcp"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Model Context Protocol server exposing Nosy to AI agents"

[[bin]]
name = "nosy-mcp"
path = "src/main.rs"

[dependencies]
nosy-model.workspace = true
nosy-codec.workspace = true
rmcp.workspace = true
schemars.workspace = true
reqwest = { workspace = true, features = ["json", "query"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
anyhow.workspace = true

[dev-dependencies]
nosy-server.workspace = true
tokio = { workspace = true, features = ["process", "net"] }
tokio-util.workspace = true
tempfile.workspace = true

[lints]
workspace = true
